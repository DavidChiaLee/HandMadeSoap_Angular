spring.application.name=handsoap

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/handsoap?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
# 刻意不給預設值：未提供 DATABASE_PASSWORD 時啟動就會失敗（fail-fast），
# 避免寫死的 root/root 悄悄跑起來。本機開發請用 .env / application-local.properties 提供，
# 名稱與可抄的範例值見專案根目錄 .env.example。
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# schema 由 Flyway 版本控管（review M7），預設 validate 做漂移偵測。
# 不要用 update：Hibernate 自動改表會與遷移腳本互相漂移。
# none 是逃生門（例如 Flyway 被關掉時的本機除錯），正式與容器一律 validate。
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Flyway（review M7）----
# 遷移檔：backend/src/main/resources/db/migration/V1__baseline.sql（寬鬆 DDL）→
#         V2__harden_constraints.sql（回填 + 收緊 + 索引）。
# baseline-on-migrate：舊 volume（表已存在、無 flyway history）首次自動 baseline，
#   把 V1 標成已執行只跑 V2；新 volume 由 mysql entrypoint 的 01-schema.sql 先建表，
#   同樣跳過 V1 跑 V2；只有真正的空庫才跑 V1。三者最終都由 V2 收斂。
# clean-disabled=true：生產絕不允許 flyway clean（會清空整庫），寫死不給 env 覆蓋。
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}

# ---- 孤兒圖檔排程掃描（review M2）----
# 刪除 entity／單圖時會在 commit 後清檔；此排程是第二道網，回收歷史累積、
# commit 後刪檔失敗、以及「檔案已落盤但 DB commit 失敗」三種來源的孤兒檔。
# 安全機制見 OrphanFileCleanupTask 類別註解（寬限期／三表引用集合／白名單／逐檔容錯）。
# 關閉：設 app.orphan-cleanup.enabled=false 後重啟（Bean 不載入）。
app.orphan-cleanup.enabled=${ORPHAN_CLEANUP_ENABLED:true}
app.orphan-cleanup.cron=${ORPHAN_CLEANUP_CRON:0 30 3 * * *}
# 寬限期（小時）：lastModified 距今小於此值的檔案一律不刪。
# 上傳流程是「先寫檔、後 commit」，此窗口內的檔案在引用查詢中查不到，
# 寬限期必須遠大於一次上傳 + commit 的時間（實務上秒級），預設 24 小時。
app.orphan-cleanup.min-age-hours=${ORPHAN_CLEANUP_MIN_AGE_HOURS:24}

# JWT 簽金鑰：刻意不給預設值。本檔會進版控、也会被 COPY 進 Docker image，
# 因此任何寫死在這裡的預設金鑰都等於公開金鑰 —— 任何人都能偽造 ADMIN token 直接進後台。
# 未設定 JWT_SECRET 時啟動會直接失敗，這是預期行為（docker-compose 已從 .env 注入）。
jwt.secret=${JWT_SECRET}
# 短有效期（15–30 分）：與可撤銷机制配套；refresh token（HTTPOnly Cookie）在 Phase 2 時才補上。
jwt.expiration-ms=900000

server.port=${SERVER_PORT:8080}

# ---- CORS 白名單（review H4）----
# 舊版 SecurityConfig 寫死 setAllowedOrigins(List.of("*"))，任何網站都能對公開端點
# 跨站讀取／寫入（例如把 /api/v1/contacts 當垃圾表單轟）。現改為白名單注入。
#
# 本機開發預設 http://localhost:4200（ng serve 的預設埠），可直接跑。
# 生產務必設為實際網域，例如 CORS_ALLOWED_ORIGINS=https://your-domain.com
# 多個來源以逗號分隔：https://a.com,https://b.com
# 刻意「不」給 * 的容錯：SecurityConfig 在啟動時會直接拒絕含 * 的設定並讓啟動失敗。
#
# 注意 CORS 不是存取控制：curl / Postman 直接打 API 不受 CORS 限制。
# 直接呼叫的防線是 anyRequest().authenticated()（H3）與登入限流（H5，尚未修）。
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---- 反向代理的來源重建 ----
# 為什麼需要：Spring 的 CorsUtils.isSameOrigin() 是用 request.getScheme() + Host + Port
# 重建 origin 來判斷「是否同源」。TLS 在 nginx 終止、Host 被改寫成 $host（不带埠），
# 後端看到的是 http://<domain>:8080，瀏覽器送的 Origin 卻是 https://<domain> —— 兩者
# 不相等，於是「同源請求」被誤判成跨來源請求。
# 舊版靠 allowedOrigins("*") 掩蓋了這個問題；改成白名單後，若不修正，正式站會整個 403
# （連登入都不行），且 Spring 拒絕時回的是空 body，前端只會顯示「操作失敗」。
#
# framework 會啟用 ForwardedHeaderFilter 採用 X-Forwarded-Proto / X-Forwarded-Port。
# 注意：ForwardedHeaderFilter 信任這些標頭，因此後端絕不可直接對外發布埠
# （docker-compose.yml 已刻意不開放 ports），否則外部可偽造標頭影響判定。
server.forward-headers-strategy=framework

# ---- 首位管理員 bootstrap ----
# 取代舊設計「admins 表為空時可匿名呼叫 POST /api/v1/admin/admins」，
# 舊設計讓部署後到 owner 建立帳號前的時間窗完全開放給公網（可被搶註 ADMIN）。
# 現在改由啟動時建立，且預設關閉 —— 未設 true 時 AdminBootstrapRunner 根本不會載入。
# 用法：設定下面三個變數 + BOOTSTRAP_ENABLED=true 後啟動一次，建立完成後改回 false。
# ---- 審計日誌落地（review H5）----
# 登入失敗／成功／被限流事件以 [audit] 前綴寫入，必須落地才能做事後取證。
# 只寫 stdout 的話，docker compose down 後日誌全部消失 —— 等同沒寫。
# docker-compose.yml 已掛載 ./logs 到 /app/logs。
logging.file.name=${LOG_FILE:/app/logs/handsoap.log}
# 單檔上限 10MB、保留 14 天，避免長期運行撐爆磁碟。
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
# 錯誤回應的 traceId 需與日誌比對（review M1）：log level 欄位後接 [traceId:...]
# %X{traceId:-} 在 MDC 無值時輸出空字串（例如啟動階段的背景日誌）。
logging.pattern.level=%5p [traceId:%X{traceId:-}]

# ---- 登入限流門檻（review H5）----
# 採指數退避：前 N 次失敗不封鎖，超過後每次失敗等待時間倍增（30秒→1分→2分…→30分封頂）。
# 成功登入會清空計數。
#
# username 門檻刻意比 IP 嚴格：
#   - username 5 次：攻擊者鎖定的是特定帳號，必須嚴格
#   - IP 30 次：IP 常是公司／CGNAT 的共用出口，門檻必須寬鬆以免誤傷真人
# 不採用「N 次鎖 M 分鐘」的硬鎖定：那會讓攻擊者只需知道帳號名（預設 admin）
# 就能把後台鎖到永遠無法登入，淨安全性是負的。
app.login.username-max-attempts=${LOGIN_USERNAME_MAX_ATTEMPTS:5}
app.login.ip-max-attempts=${LOGIN_IP_MAX_ATTEMPTS:30}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}

# ---- Actuator 健康檢查（review M7）----
# probes.enabled=true 才有 /actuator/health/readiness 與 /liveness 分流：
# readiness 含 DataSource 檢查，DB 未就緒前回 503，正好拿來擋 nginx 進流量；
# 只打 /actuator/health（liveness 語意）擋不住「DB 未好就進流量」的 500。
# exposure 只開 health：避免日後有人加 include=* 把 env/beans/mappings 一起公開。
# show-details=never：預設會洩漏 DB 名稱與狀態細節，compose 探針只需要 UP/DOWN。
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# 本機開發可建立 application-local.properties 放機密（此檔名已被 .gitignore 排除，
# 放在專案根目錄即可）。optional: 前綴代表檔不存在時不會報錯，不影響容器與 CI。
spring.config.import=optional:file:./application-local.properties
