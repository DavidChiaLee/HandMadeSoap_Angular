version: "3.8"

services:
  nginx:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - handsoap-net

  backend:
    build: ./backend
    # 刻意不發布對外埠：後端只透過 handsoap-net 內部通訊，對外一律走 nginx（80/443）。
    # 若這裡保留 ports，後端 API（含 /api/v1/admin/**）會直接暴露在公網，
    # 繞過 nginx 的 TLS 與任何存取控制，等同多開一個後門。
    # 注意：目前 pom.xml 沒有 spring-boot-starter-actuator，/actuator/health 不存在。
    # 日後若要加入 actuator 做健康檢查，SecurityConfig 已將 anyRequest() 改為
    # authenticated()（review H3），/actuator/** 會預設需要認證，
    # 必須顯式加上 requestMatchers("/actuator/health").permitAll() 才能讓探針使用。
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/handsoap?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - JWT_SECRET=${JWT_SECRET}
      - FILE_UPLOAD_DIR=/app/uploads
      # CORS 白名單（review H4）：後端啟動時會驗證，不可含 *（含 * 直接啟動失敗）。
      # 生產請在 .env 設為實際網域，例如 https://your-domain.com
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # 首位管理員 bootstrap（預設關閉；建立完成後請把 .env 的值設回 false）
      - BOOTSTRAP_ENABLED=${BOOTSTRAP_ENABLED:-false}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
    volumes:
      - ./uploads:/app/uploads
      # 審計日誌落地（review H5）：登入失敗／成功／被限流事件記在 /app/logs。
      # 沒有這個掛載的話，日誌只寫在容器 stdout，docker compose down 後全部消失，
      # 「寫入審計日誌」就等於沒寫。請確認 logs/ 目錄已存在且可被容器用戶寫入。
      - ./logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - handsoap-net

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MYSQL_DATABASE=handsoap
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      # 備份目錄唯讀掛入，供 05-restore-seed.sh 在全新初始化時還原本機內容
      # （此目錄已被 .gitignore 排除，不會進版控）
      - ./mysql/backup:/seed:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - handsoap-net

  backup:
    image: mysql:8.0
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - BACKUP_INTERVAL=300
      - BACKUP_RETRY=10
    volumes:
      - ./mysql/backup:/backup
      - ./backups:/backups
      - ./uploads:/uploads:ro
      - ./mysql/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks:
      - handsoap-net

volumes:
  mysql-data:

networks:
  handsoap-net:
    driver: bridge
