user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ---- 登入限流（review H5）----
    # 注意 limit_req 擋的是「洪水式大量請求」，擋不住「慢速精準爆破」——
    # 攻擊者若每隔 20 秒打一次，rate=5r/m 完全不會觸發。
    # 因此這一層<b>不是</b>唯一防線，必須搭配後端 LoginAttemptService
    # （以 username 為 key 的指數退避）與 BCrypt cost 12 一起使用。
    #
    # 這裡用 $binary_remote_addr 而非 X-Forwarded-For：nginx 本身就是最外層，
    # $binary_remote_addr 就是真實客戶端 IP。若日後架構前面再加 CDN/Load Balancer，
    # 必須改成 $http_x_forwarded_for 並且加上 CDN 的 IP 段白名單，否則會全擋到 CDN 的 IP。
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ---- 聯絡表單防灌水（review 728）----
    # limit_req 只有 r/s 與 r/m，<b>沒有</b> r/h ——「每小時 5 件」這種語意
    # 只能由後端 ContactSubmissionThrottleService（滑動窗口）負責。
    # 這裡的 rate=10r/m 是「洪水防護」層：只擋機器式猛敲，不擋正常填單
    # （真人填一張表單起碼幾分鐘，10r/m 對真人不可能觸發）。
    # 注意 location 前綴<b>不可</b>寫 /api/v1/contacts/ （含尾斜線）——
    # 前端 POST 的是 /api/v1/contacts（無尾斜線），前綴不匹配會漏過本段。
    limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        location /api/ {
# 登入端點專屬的限流（review H5）。
        # nginx 前綴匹配取「最長」者，因此這個 location 會優先於下面的 location /api/。
        location ^~ /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;

            # 預設是 503，但「太多請求」語意上應是 429。兩者對前端的意義完全不同。
            limit_req_status 429;

            # 關鍵：nginx 被觸發時回的是 HTML，而前端 login.component.ts 讀的是
            # err.error?.message → 拿不到就會顯示「登入失敗，請檢查您的帳號密碼」，
            # 把「請求過於頻繁」誤導成「密碼錯誤」。因此直接回 JSON 字串，
            # 不用 error_page + named location —— named location（@開頭）
            # 只能放在 location 區塊內，不能定義在 server 層級（nginx -t 會報 emerg）。
            error_page 429 = '{"success":false,"message":"嘗試過於頻繁，請稍後再試","data":null}';

            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 與 location /api/ 保持一致（見該處註解）：少了這個標頭，
            # 後端會把 https://domain 判成 http://domain:8080，
            # 在 CORS 白名單模式下同源請求會被誤判為跨來源而 403。
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 聯絡表單端點專屬的洪水防護（review 728）。
        # 前綴刻意<b>不含</b>尾斜線：前端 POST /api/v1/contacts（無尾斜線），
        # 寫成 /api/v1/contacts/ 會因前綴不匹配而完全繞過限流。
        location ^~ /api/v1/contacts {
            limit_req zone=contact burst=10 nodelay;

            # 與 auth 相同的理由：預設 503 語意不對，且觸發時回 HTML 會讓
            # 前端拿不到 message，因此這裡直接回 JSON 字串。
            limit_req_status 429;
            error_page 429 = '{"success":false,"message":"送出過於頻繁，請稍後再試","data":null}';

            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 同 location /api/：缺此標頭會在 CORS 白名單模式下把同源誤判為跨來源 → 403。
            proxy_set_header X-Forwarded-Port $server_port;
        }
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 後端已設定 server.forward-headers-strategy=framework（review H4），
            # 會啟用 ForwardedHeaderFilter 採用 X-Forwarded-Proto / X-Forwarded-Port 重建
            # 原始 origin。少了這個標頭，後端會把 https://domain 判成 http://domain:8080，
            # 於是同源請求被誤判為跨來源 → 白名單模式下正式站會整個 403。
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 上傳圖片：後端以 /uploads/** 提供（Spring 靜態資源）。
        # 少了這個 location，圖片會落到下面的 location /（try_files 回 index.html），
        # 變成「HTTP 200 但是 HTML」，比 404 更難察覺。
        #
        # 用 ^~ 而非前綴 location：日後若有人加了 location ~ \.(js|css)$ 之類的
        # 正規 location，未加 ^~ 會讓它優先於本段、把圖片當成靜態檔去找 Angular dist。
        location ^~ /uploads/ {
            proxy_pass http://backend:8080;

            # 圖片數量遠多於 API，對後端保持 keepalive 可省下每次的 TCP 連線成本
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 後端若日後也送出 Cache-Control（例如設定 spring.web.resources.cache.period），
            # add_header 是「附加」不是「覆寫」，會變成兩個標頭而讓瀏覽器行為不確定。
            # 先隱藏上游的，再由這裡統一發送單一份。
            proxy_hide_header Cache-Control;

            # nginx 的 add_header 只要有任一層自己定義就不再繼承上層，
            # 因此這裡必須重列 server 層的安全表頭（圖片是使用者上傳內容，nosniff 尤其重要）。
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";

            # 上傳檔案未驗證類型（review H2）：惡意的 .svg / .html 若被「直接開啟」
            # 會成為 document 而執行其中腳本（經 <img> 載入則不會）。
            # default-src 'none' 擋掉所有子資源外連，sandbox 令腳本、表單、同源存取全失效，
            # 兩者都不影響圖片以 <img src> 正常顯示。
            add_header Content-Security-Policy "default-src 'none'; sandbox";

            # immutable 的前提是「檔名永不复用」：FileStorageService.saveFile 以
            # UUID.randomUUID() + 副檔名存檔，內容變動必定換新 URL，管理員覆傳也不會
            # 讓舊圖變成錯誤內容。若日後改成「同檔名覆寫」，必須移除 immutable，
            # 否則使用者會在 30 天內都拿到舊圖。
            #
            # 刻意不加 always：這條路徑經常回 404（檔案不存在 / 尚未上傳），
            # 帶 always 會讓 404 也被快取 30 天。
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # 前綴 location /uploads/ 不匹配「無尾斜線」的 /uploads，該請求會落到
        # location / 的 try_files 而拿到 index.html（200 卻是 HTML）。
        # 這裡沒有目錄列表的用途，直接 404 讓行為可預期。
        location = /uploads {
            return 404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # 同樣的 add_header 繼承陷阱：本層定義了 Cache-Control / Pragma，
            # 就會讓 server 層的安全表頭全部失效，HTML 與 JS/CSS 都拿不到 nosniff 等。
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";

            # 防止瀏覽器快取舊版 Angular 靜態資源而看到舊畫面
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }
    }
}
