user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # ---- 登入限流（review H5）----
    # 注意 limit_req 擋的是「洪水式大量請求」，擋不住「慢速精準爆破」——
    # 攻擊者若每隔 20 秒打一次，rate=5r/m 完全不會觸發。
    # 因此這一層<b>不是</b>唯一防線，必須搭配後端 LoginAttemptService
    # （以 username 為 key 的指數退避）與 BCrypt cost 12 一起使用。
    #
    # 這裡用 $binary_remote_addr 而非 X-Forwarded-For：nginx 本身就是最外層，
    # $binary_remote_addr 就是真實客戶端 IP。若日後架構前面再加 CDN/Load Balancer，
    # 必須改成 $http_x_forwarded_for 並且加上 CDN 的 IP 段白名單，否則會全擋到 CDN 的 IP。
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ---- 聯絡表單防灌水（review 728）----
    # limit_req 只有 r/s 與 r/m，<b>沒有</b> r/h ——「每小時 5 件」這種語意
    # 只能由後端 ContactSubmissionThrottleService（滑動窗口）負責。
    # 這裡的 rate=10r/m 是「洪水防護」層：只擋機器式猛敲，不擋正常填單
    # （真人填一張表單起碼幾分鐘，10r/m 對真人不可能觸發）。
    # 注意 location 前綴<b>不可</b>寫 /api/v1/contacts/ （含尾斜線）——
    # 前端 POST 的是 /api/v1/contacts（無尾斜線），前綴不匹配會漏過本段。
    limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # 對齊後端 spring.servlet.multipart.max-file-size / max-request-size = 20MB。
        # 為何是 21M 而不是 20M：multipart 的 boundary 與每個欄位的額外位元組會讓
        # 一個 20MB 的檔案實際傳輸量略大於 20MB。若這裡寫 20M，合法檔案會被 nginx
        # 直接以 413 擋在門口，永遠不會進到 Spring —— 後端的 20MB 驗證形同虛設，
        # 且錯誤訊息變成 nginx 的預設英文頁。21M 留 1MB 餘量給 multipart 額外負擔。
        client_max_body_size 21M;

        # ---- 安全表頭（review L8）----
        # 刻意移除 X-XSS-Protection：Chrome 78 起移除 XSS Auditor、Safari/Edge 從未實作，
        # 該表頭在現代瀏覽器完全無效；舊版 IE 的實作甚至曾被用來繞過網站的過濾
        # （CVE 2015-1291 類型的 XSS 繞過）。防 XSS 的正解是下面的 CSP，不是這個表頭。
        #
        # 注意 add_header 的繼承陷阱：任何 location 只要自己定義了任一 add_header，
        # 就會「全部不繼承」本層，因此下面 /uploads/、hashed 產物、/index.html、
        # location / 四處都必須逐條重列，漏一處該路徑就完全沒有安全表頭。
        #
        # 另外所有安全表頭都帶 always：nginx 的 add_header 預設只對
        # 200/201/204/206/301/302/303/304/307/308 生效，因此「不加 always」會讓
        # 404 / 500 / 502 這些回應完全沒有 CSP 與 nosniff —— 而攻擊頁、錯誤頁
        # 往往正是最需要 CSP 的地方（實測：加 always 前 404 的安全表頭數為 0）。
        # Cache-Control 刻意「不」加 always：快取 404 會讓「檔案不存在」這個事實
        # 被快取住，之後補上檔案也看不到（/uploads/ 那處已有同樣理由的註解）。
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # CSP：僅放行本專案實際需要的來源，每條對應都有實測依據（見下方註解）。
        # 已用 dist/index.html 產物逐項核對：Angular 18 會把樣式內嵌成 inline <style>
        # （critters 關鍵 CSS + Tailwind 基礎樣式），並用
        # <link rel="stylesheet" href="styles-XXX.css" media="print" onload="this.media='all'">
        # 的非同步載入，因此 script-src 與 style-src 都必須含 'unsafe-inline'，
        # 否則開 JS 時樣式表永遠不會載入 → 整站無樣式。
        #   default-src 'self'              其餘資源一律同源
        #   script-src 'self' 'unsafe-inline'  onload="this.media='all'" 需要 inline script
        #   style-src  ... 'unsafe-inline'   產物 head 有 2 個 inline <style>
        #   style-src  ... fonts.googleapis.com  index.html 的 <link> 取字型 CSS
        #   font-src   ... fonts.gstatic.com     inline @font-face 的 woff2 來源
        #   img-src 'self' data:             圖片走同源 /uploads/；data: 給 data URI 圖片餘裕
        #   connect-src 'self'               前端只打同源 /api/v1/**，無第三方 API
        #   form-action 'self'               表單只能回傳本站
        #   base-uri 'self'                  擋 <base> 被改成外部站以劫持相對路徑
        #   object-src 'none'                本專案無 Flash/plugin
        #   frame-ancestors 'none'           等同 X-Frame-Options DENY 的現代寫法
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

        # 預設值，明確寫出以免日後瀏覽器改預設（例如降到 origin-only）時行為漂移。
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 關閉本專案完全用不到的能力：即使 XSS 成功也拿不到鏡頭／麥克風／定位。
        # payment=() 也一併關（本專案無金流），避免誤以為有支援。
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        location /api/ {
# 登入端點專屬的限流（review H5）。
        # nginx 前綴匹配取「最長」者，因此這個 location 會優先於下面的 location /api/。
        location ^~ /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;

            # 預設是 503，但「太多請求」語意上應是 429。兩者對前端的意義完全不同。
            limit_req_status 429;

            # 關鍵：nginx 被觸發時回的是 HTML，而前端 login.component.ts 讀的是
            # err.error?.message → 拿不到就會顯示「登入失敗，請檢查您的帳號密碼」，
            # 把「請求過於頻繁」誤導成「密碼錯誤」。因此直接回 JSON 字串，
            # 不用 error_page + named location —— named location（@開頭）
            # 只能放在 location 區塊內，不能定義在 server 層級（nginx -t 會報 emerg）。
            error_page 429 = '{"success":false,"message":"嘗試過於頻繁，請稍後再試","data":null}';

            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 與 location /api/ 保持一致（見該處註解）：少了這個標頭，
            # 後端會把 https://domain 判成 http://domain:8080，
            # 在 CORS 白名單模式下同源請求會被誤判為跨來源而 403。
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 聯絡表單端點專屬的洪水防護（review 728）。
        # 前綴刻意<b>不含</b>尾斜線：前端 POST /api/v1/contacts（無尾斜線），
        # 寫成 /api/v1/contacts/ 會因前綴不匹配而完全繞過限流。
        location ^~ /api/v1/contacts {
            limit_req zone=contact burst=10 nodelay;

            # 與 auth 相同的理由：預設 503 語意不對，且觸發時回 HTML 會讓
            # 前端拿不到 message，因此這裡直接回 JSON 字串。
            limit_req_status 429;
            error_page 429 = '{"success":false,"message":"送出過於頻繁，請稍後再試","data":null}';

            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 同 location /api/：缺此標頭會在 CORS 白名單模式下把同源誤判為跨來源 → 403。
            proxy_set_header X-Forwarded-Port $server_port;
        }
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 後端已設定 server.forward-headers-strategy=framework（review H4），
            # 會啟用 ForwardedHeaderFilter 採用 X-Forwarded-Proto / X-Forwarded-Port 重建
            # 原始 origin。少了這個標頭，後端會把 https://domain 判成 http://domain:8080，
            # 於是同源請求被誤判為跨來源 → 白名單模式下正式站會整個 403。
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 上傳圖片：後端以 /uploads/** 提供（Spring 靜態資源）。
        # 少了這個 location，圖片會落到下面的 location /（try_files 回 index.html），
        # 變成「HTTP 200 但是 HTML」，比 404 更難察覺。
        #
        # 用 ^~ 而非前綴 location：日後若有人加了 location ~ \.(js|css)$ 之類的
        # 正規 location，未加 ^~ 會讓它優先於本段、把圖片當成靜態檔去找 Angular dist。
        location ^~ /uploads/ {
            proxy_pass http://backend:8080;

            # 圖片數量遠多於 API，對後端保持 keepalive 可省下每次的 TCP 連線成本
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 後端若日後也送出 Cache-Control（例如設定 spring.web.resources.cache.period），
            # add_header 是「附加」不是「覆寫」，會變成兩個標頭而讓瀏覽器行為不確定。
            # 先隱藏上游的，再由這裡統一發送單一份。
            proxy_hide_header Cache-Control;

            # nginx 的 add_header 只要有任一層自己定義就不再繼承上層，
            # 因此這裡必須重列 server 層的安全表頭（圖片是使用者上傳內容，nosniff 尤其重要）。
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;

            # 刻意沿用 server 層的 strict-origin-when-cross-origin：使用者上傳圖片被貼到
            # 外部論壇時仍需帶 enough 資訊讓站方看到流量來源，沒有理由收緊成 no-referrer。
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

            # 上傳檔案未驗證類型（review H2）：惡意的 .svg / .html 若被「直接開啟」
            # 會成為 document 而執行其中腳本（經 <img> 載入則不會）。
            # default-src 'none' 擋掉所有子資源外連，sandbox 令腳本、表單、同源存取全失效，
            # 兩者都不影響圖片以 <img src> 正常顯示。
            #
            # 這裡刻意「不」沿用 server 層那份 CSP：那份放行 fonts.gstatic.com 等來源，
            # 對使用者上傳內容而言是完全不必要的攻擊面。本層這份更嚴（全部 none + sandbox），
            # 且因為 add_header 不繼承，寫在這裡正好蓋掉 server 層的值，不會出現兩份。
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;

            # immutable 的前提是「檔名永不复用」：FileStorageService.saveFile 以
            # UUID.randomUUID() + 副檔名存檔，內容變動必定換新 URL，管理員覆傳也不會
            # 讓舊圖變成錯誤內容。若日後改成「同檔名覆寫」，必須移除 immutable，
            # 否則使用者會在 30 天內都拿到舊圖。
            #
            # 刻意不加 always：這條路徑經常回 404（檔案不存在 / 尚未上傳），
            # 帶 always 會讓 404 也被快取 30 天。
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # 前綴 location /uploads/ 不匹配「無尾斜線」的 /uploads，該請求會落到
        # location / 的 try_files 而拿到 index.html（200 卻是 HTML）。
        # 這裡沒有目錄列表的用途，直接 404 讓行為可預期。
        location = /uploads {
            return 404;
        }

        # ---- 帶內容 hash 的產物：可永久快取（review L8 ①）----
        # angular.json 已設定 "outputHashing": "all"，每次內容變動檔名必換，
        # 因此這些資源可以放心給一年 immutable，回訪時連條件請求都省掉。
        #
        # 正則刻意「不是」 `\.[0-9a-f]{16,}\.(js|css|woff2|png)$`：實測本專案產物為
        # chunk-2WYX6HCO.js / main-OBG46PVB.js / styles-PQVIZ77B.css ——
        # hash 是 8 碼「大寫英數」（esbuild 風格），[0-9a-f]{16,} 命中數為 0/25，
        # 照抄會得到一個永不生效的死 location。這裡用 [A-Z0-9]{8}。
        # 用 ~*（不分大小寫）是為了日後 hash 格式若改回小寫也仍然命中。
        #
        # 不加 png：使用者上傳的圖在 /uploads/（代理到 Spring，另有自己的快取策略），
        # dist 內的 assets/placeholder.svg 沒有 hash，不該被 immutable。
        #
        # add_header 繼承陷阱：本層定義了 add_header，server 層的安全表頭全部不繼承，
        # 必須逐條重列（否則 JS/CSS 拿不到 nosniff / CSP）。
        # 正則必須用雙引號包住：`{8}` 的花括號若不引號會被 nginx 的設定檔剖析器
        # 當成 location 區塊的開始，報 emerg "unknown directive"。
        location ~* "-[A-Z0-9]{8}\.(js|css|woff2)$" {
            # root 必須重複宣告：它只定義在下面的 location / 裡，而 location 層級的
            # root 不會被其他 location 繼承。漏了這裡會 fallback 到編譯預設的
            # /etc/nginx/html（nginx:alpine 的 --prefix），所有 bundle 一律 404，
            # 且 nginx -t 檢查不出來（這是執行期 404，不是設定檔錯誤）。
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";

            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        # ---- index.html：每次都要驗證（review L8 ①）----
        # index.html 是「哪個 hash 的 bundle 才是現行版本」的唯一來源，一旦被長期快取，
        # 使用者就會一直拿舊檔名去要舊 bundle（就算新 bundle 在伺服器上一年不變也拿不到），
        # 表現為「部署了但使用者看到舊畫面」。因此用 no-cache（可存但每次必驗證，304 很便宜）
        # 而非 no-store（完全不存，每次都重傳整份 HTML）。
        #
        # 注意：SPA 深連結（如 /admin/soaps）經 location / 的 try_files 落到 /index.html 時，
        # nginx 走的是內部 rewrite，不會重新匹配 location，因此仍由 location / 發標頭；
        # 這個 location 只覆蓋「直接請求 /index.html」這一種路徑。兩處的 no-cache 語意一致，
        # 不會互相矛盾。
        location = /index.html {
            # 同上的 root 陷阱：location 層級的 root 不繼承，必須重複宣告。
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, must-revalidate";

            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # add_header 繼承陷阱：本層定義了任一 add_header，server 層的安全表頭
            # 全部不繼承，必須逐條重列，否則 HTML 與無 hash 資源完全沒有安全表頭。
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

            # 帶 hash 的 JS/CSS 已由上面的 regex location 接手 expires 1y + immutable，
            # 因此這裡的 no-store 現在只作用在「沒有 hash 的資源」：
            # 3rdpartylicenses.txt、assets/placeholder.svg、favicon.ico，
            # 以及 SPA 深連結 rewrite 過來的 HTML。這些都應該每次驗證，no-store 是對的。
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }
    }
}
