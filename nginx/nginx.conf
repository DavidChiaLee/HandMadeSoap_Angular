user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 上傳圖片：後端以 /uploads/** 提供（Spring 靜態資源）。
        # 少了這個 location，圖片會落到下面的 location /（try_files 回 index.html），
        # 變成「HTTP 200 但是 HTML」，比 404 更難察覺。
        #
        # 用 ^~ 而非前綴 location：日後若有人加了 location ~ \.(js|css)$ 之類的
        # 正規 location，未加 ^~ 會讓它優先於本段、把圖片當成靜態檔去找 Angular dist。
        location ^~ /uploads/ {
            proxy_pass http://backend:8080;

            # 圖片數量遠多於 API，對後端保持 keepalive 可省下每次的 TCP 連線成本
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 後端若日後也送出 Cache-Control（例如設定 spring.web.resources.cache.period），
            # add_header 是「附加」不是「覆寫」，會變成兩個標頭而讓瀏覽器行為不確定。
            # 先隱藏上游的，再由這裡統一發送單一份。
            proxy_hide_header Cache-Control;

            # nginx 的 add_header 只要有任一層自己定義就不再繼承上層，
            # 因此這裡必須重列 server 層的安全表頭（圖片是使用者上傳內容，nosniff 尤其重要）。
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";

            # 上傳檔案未驗證類型（review H2）：惡意的 .svg / .html 若被「直接開啟」
            # 會成為 document 而執行其中腳本（經 <img> 載入則不會）。
            # default-src 'none' 擋掉所有子資源外連，sandbox 令腳本、表單、同源存取全失效，
            # 兩者都不影響圖片以 <img src> 正常顯示。
            add_header Content-Security-Policy "default-src 'none'; sandbox";

            # immutable 的前提是「檔名永不复用」：FileStorageService.saveFile 以
            # UUID.randomUUID() + 副檔名存檔，內容變動必定換新 URL，管理員覆傳也不會
            # 讓舊圖變成錯誤內容。若日後改成「同檔名覆寫」，必須移除 immutable，
            # 否則使用者會在 30 天內都拿到舊圖。
            #
            # 刻意不加 always：這條路徑經常回 404（檔案不存在 / 尚未上傳），
            # 帶 always 會讓 404 也被快取 30 天。
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # 前綴 location /uploads/ 不匹配「無尾斜線」的 /uploads，該請求會落到
        # location / 的 try_files 而拿到 index.html（200 卻是 HTML）。
        # 這裡沒有目錄列表的用途，直接 404 讓行為可預期。
        location = /uploads {
            return 404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # 同樣的 add_header 繼承陷阱：本層定義了 Cache-Control / Pragma，
            # 就會讓 server 層的安全表頭全部失效，HTML 與 JS/CSS 都拿不到 nosniff 等。
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";

            # 防止瀏覽器快取舊版 Angular 靜態資源而看到舊畫面
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }
    }
}
